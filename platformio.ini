; PlatformIO configuration for the robot arm MCU (Arduino Due)
; Build:  pio run
; Upload: pio run -t upload   (Due programming port, USB ID 2341:003d)
; Serial: 115200 baud on the programming port (ComPort = Serial in config.h)

[env:due]
platform = atmelsam
board = due
framework = arduino
lib_deps =
    waspinator/AccelStepper@^1.64
    arduino-libraries/Servo@^1.2.2
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
monitor_speed = 115200
